# CI — build + full test suite on every push, from PUBLIC sources only (no game files on the runner).
# tools/fetch-refs.ps1 collects the reference DLLs (Newtonsoft/BepInEx/Harmony/Unity — see its header);
# the game's own DLLs are not needed: the plugin's only compile-time game surface is string-based reflection.
# NOT here (need the game or Unity): bindcheck (game DLLs), the editor Feature/Smoke tests, in-game verification.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  # workflow_dispatch: lets publish-wiki be exercised deliberately and RE-RUN after a failure without an empty
  # commit. The job's ref check keeps it master-only; a dispatch on any other branch is a no-op.
  workflow_dispatch:

# Read-only by default. Only the post-CI wiki publisher below receives a narrowly scoped write token.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch reference DLLs (public sources)
        run: pwsh tools/fetch-refs.ps1
      - name: Build plugin
        run: dotnet build HumankindAssetFramework.csproj -c Release --nologo
      - name: Run tests
        run: dotnet test Tests/HumankindAssetFramework.Tests.csproj -c Release --nologo
      # VEHICLE LAB PURE MATH — ast-extracts the two pure helpers from vehicle_rig.py and checks the oar-recovery
      # calibration (the exact eps regression that once split 64 oars into 104) plus the shared-clip cycle fitting.
      # Blender-free by construction, so the runner's stock Python is enough. Wired 2026-09-05: the file existed
      # since the calibration fix but ran only by hand — a guard nobody runs guards nothing.
      - name: Vehicle Lab math tests (oar calibration guard)
        shell: bash
        run: python Tests/test_vehicle_rig_math.py
      # Needs neither the game nor Unity — pure Markdown/link checking, so it belongs on the runner too.
      # It was in the pre-push gate only, which a --no-verify (or a web edit) walks straight past.
      - name: Docs guard (links + notes convention)
        shell: bash
        run: bash tools/check-docs.sh

      # The other two source-only guards belong here for the same reason the docs guard does: a pre-push hook is
      # per-clone config that a PR author may not have, and --no-verify (or a web edit) walks straight past it.
      # Neither needs the game or Unity — both are greps over the tree, milliseconds each. Added 2026-08-22 after
      # a review found the hot-path gate had been passing on three live violations for want of a `-i`.
      - name: Hot path (no shipped spikes in Update)
        shell: bash
        run: bash tools/check-hot-path.sh

      - name: Binding catalog surface (every by-name site catalogued)
        shell: bash
        run: bash tools/check-catalog.sh

      # Same reasoning again: source-only, milliseconds, and the class it catches is invisible at runtime by
      # construction — a failed parse overwriting its own default throws nothing and logs nothing.
      - name: Parse shape (no dead-default TryParse)
        shell: bash
        run: bash tools/check-parse-shape.sh

      # Same class one layer down, and invisible for the same reason: GetMember returns null for a renamed member
      # and Convert.To*(null) returns zero WITHOUT throwing, so `bool x = true; try { x = … } catch {}` silently
      # becomes false. Two live sites then skipped their work forever. Source-only, milliseconds.
      - name: Member shape (no dead-sentinel Convert(GetMember))
        shell: bash
        run: bash tools/check-member-shape.sh

      # REGISTRY SCHEMA PARITY — IN-REPO since 2026-08-24. The editor WRITES pack.json from ModelDef; this plugin
      # READS it two ways, and a key the REGEX FALLBACK forgot is invisible at runtime by construction: a
      # malformed-JSON pack silently loses that field, no throw, no log.
      #
      # This step used to check out sswelm/ENCReload into _enc/ and run the script from there, because that repo
      # owned the authoring tools. The tools moved into editor/ here, so both halves of the contract are now in one
      # tree: no second checkout, no orientation arguments, and no way for one side to be checked and not the other.
      # (That is also what killed the old best-effort [SKIP] in tools/check.sh, which fired on every runner.)
      #
      # Drilled, not assumed: deleting one Regex.Matches line from ParseModels turns this step red with rc=1 and
      # names the field.
      - name: Registry schema parity (plugin parse vs baker ModelDef)
        shell: bash
        run: bash tools/check_schema_parity.sh

      # HAND-LIST GATE — moved here with the tools it guards. A field a window's UI edits but its ownership-rebase
      # doesn't re-apply is thrown away on every Save: no error, no log, the value simply reverts (the combatZ
      # class, drill-caught 2026-08-19). Pure source analysis of editor/, so it belongs in CI as well as the hook.
      #
      # Its sibling, tools/editor_compile_check.sh, deliberately does NOT run here: it needs a licensed Unity
      # 2021.3.1f1 install (UnityEditor.dll, the MonoBleedingEdge profile), none of which a hosted runner has or
      # may redistribute. That one stays hook-only — the single check a --no-verify still gets past.
      - name: Hand-list gate (ownership rebases)
        shell: bash
        run: bash tools/check_handlists.sh

      # PACKAGE META — every path in editor/ needs a COMMITTED .meta. Under Assets/ Unity writes missing ones the
      # moment the editor regains focus, so the working copy is always correct and only the COMMIT is short; in a
      # package folder Unity cannot write them at all and drops the asset. That asymmetry makes this invisible from
      # the authoring side by construction, which is exactly why it broke three installs on 2026-08-24 — and why it
      # belongs in CI, where the check runs against the index rather than somebody's working tree.
      # Fault-injected on the day it was written: un-committing the asmdef's .meta and the Plugins folder's .meta
      # each turned it red with rc=1 and named the path.
      - name: Package meta (every editor/ path has one)
        shell: bash
        run: bash tools/check-package-meta.sh

  # Publish only code that has already passed the complete source-only CI job. Pull requests never enter this job,
  # so unmerged workflow changes cannot obtain a write token or alter the public wiki. Running on every master push
  # is deliberate: sync_wiki.sh is deterministic and the staged-diff check makes non-doc pushes a cheap no-op.
  publish-wiki:
    name: Publish wiki
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: haf-wiki-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Clone wiki
        shell: bash
        env:
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: git clone --quiet --depth 1 "$WIKI_URL" "$RUNNER_TEMP/haf-wiki"

      - name: Generate validated wiki
        shell: bash
        run: bash tools/sync_wiki.sh "$RUNNER_TEMP/haf-wiki"

      - name: Publish changed pages
        shell: bash
        run: |
          wiki="$RUNNER_TEMP/haf-wiki"
          git -C "$wiki" add -A
          if git -C "$wiki" diff --cached --quiet; then
            echo "Wiki already matches ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git -C "$wiki" config user.name "github-actions[bot]"
          git -C "$wiki" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wiki" commit -m "docs: sync wiki from ${GITHUB_SHA::7}"
          git -C "$wiki" push origin HEAD:master
          echo "Published wiki pages generated from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
